<div class="chat-shell">
  <!-- Ambient background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Header -->
  <header class="chat-header">
    <div class="header-left">
      <div class="avatar-pulse">
        <div class="avatar-core"></div>
      </div>
      <div class="header-info">
        <span class="header-name">Gemini</span>
        <span class="header-status"> <span class="status-dot"></span>Online </span>
      </div>
    </div>

    <!-- <div><img  class="" style="width: 50px;" src = "assets/images/bott2.png"></div> -->
    <div class="header-badge">AI Assistant</div>
  </header>

  <!-- Messages -->
  <main class="messages-area" #scrollContainer>
    <div class="messages-inner">
      <!-- Empty state -->
      <div class="empty-state" *ngIf="messages.length === 0 && !loading">
        <div style="display: flex; gap: 10px; width: auto">
          <div class="empty-icon">✦</div>
          <img class="" style="width: 50px; height: 40px; margin-top: -15px !important" src="../../../content/images/bott2.png" />
          <div class="empty-icon">✦</div>
        </div>

        <p class="empty-title">How can I help you?</p>
        <p class="empty-sub">Ask about users, data, or anything else.</p>
        <div class="suggestion-chips">
          <button class="chip" (click)="sendSuggestion('Show me all users')">Show me all users</button>
          <button class="chip" (click)="sendSuggestion('What is the email of user 3?')">Email of user 3</button>
          <button class="chip" (click)="sendSuggestion('Who lives in city McKenziehaven?')">Find by city</button>
        </div>
      </div>

      <!-- Message bubbles -->
      <div
        *ngFor="let m of messages; let i = index"
        class="message-row"
        [class.user-row]="m.role === 'user'"
        [class.bot-row]="m.role === 'bot'"
      >
        <div class="bubble-wrap">
          <div class="role-icon" *ngIf="m.role === 'bot'">✦</div>
          <div class="bubble" [class.user-bubble]="m.role === 'user'" [class.bot-bubble]="m.role === 'bot'">
            <p class="bubble-text">{{ m.text }}</p>
            <span class="bubble-time">{{ m.time }}</span>
          </div>
          <div class="role-icon user-icon" *ngIf="m.role === 'user'">U</div>
        </div>
      </div>

      <!-- Typing indicator -->
      <div class="message-row bot-row" *ngIf="loading">
        <div class="bubble-wrap">
          <div class="role-icon">✦</div>
          <div class="bubble bot-bubble typing-bubble">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Input bar -->
  <footer class="input-bar">
    <div class="input-wrap" [class.focused]="isFocused">
      <textarea
        [(ngModel)]="userInput"
        (keydown.enter)="onEnter($any($event))"
        (focus)="isFocused = true"
        (blur)="isFocused = false"
        placeholder="Ask anything…"
        rows="1"
        class="chat-input"
        [disabled]="loading"
      ></textarea>
      <button class="send-btn" (click)="send()" [disabled]="loading || !userInput.trim()" [class.active]="userInput.trim()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
    <!-- <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p> -->
  </footer>
</div>
